name: ci
on:
  push: { branches: [main] }
  pull_request:
defaults:
  run:
    working-directory: treadle

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
          cache-dependency-path: treadle/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm coverage
      - run: pnpm brand:check
      - run: pnpm audit:prod
      - name: conformance
        run: pnpm --filter @treadle/conformance test
