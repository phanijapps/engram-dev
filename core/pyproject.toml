[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memex-core"
version = "0.1.0"
description = "The one-engine core: unified memory + knowledge control plane. Strangler-fig seed over engine/ (memory plane) and kit/ (knowledge plane); they migrate into this package until one engine remains."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "memex contributors" }]
dependencies = [
    "memex",
    "okf-kit",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memex-core = "memex_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memex_core"]

[tool.uv.sources]
memex = { path = "../engine" }
okf-kit = { path = "../kit" }
