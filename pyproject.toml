[project]
name = "memex-beta"
version = "0.1.0"
description = "memex — the one-engine workspace: core (front face), memex (memory plane), okf (knowledge plane)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["memex", "okf-kit", "memex-core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine/memex", "engine/okf", "engine/core"]

[tool.uv.sources]
memex = { workspace = true }
okf-kit = { workspace = true }
memex-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
