[project]
name = "memex-beta"
version = "0.1.0"
description = "memex — the SDD harness: okf (knowledge) + loom (loop)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["okf-kit", "loom-kit"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine/okf", "engine/loom"]

[tool.uv.sources]
okf-kit = { workspace = true }
loom-kit = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
