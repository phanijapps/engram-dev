<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The spec library</title>
<style>
  :root { --bg:#101418; --panel:#171d24; --card:#1d252e; --line:#2a3441; --ink:#e8edf2; --dim:#93a1b0;
          --you:#f5a623; --go:#3fb950; --stuck:#f85149; --rev:#58a6ff; --amber:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:17px; margin:0; }
  #search { flex:0 1 340px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  #layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 57px); }
  aside { border-right:1px solid var(--line); padding:14px; overflow-y:auto; max-height:calc(100vh - 57px); position:sticky; top:57px; }
  main { padding:18px 26px; overflow-y:auto; }
  .group h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
  .group h2 .n { color:var(--you); }
  .card { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); margin-bottom:8px; cursor:pointer; }
  .card:hover, .card.sel { border-color:var(--rev); }
  .card .t { font-weight:600; }
  .card .m { font-size:12px; color:var(--dim); display:flex; gap:8px; margin-top:2px; flex-wrap:wrap; }
  .chip { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid var(--line); color:var(--dim); }
  .chip.you { color:var(--you); border-color:var(--you); }
  .chip.go { color:var(--go); border-color:var(--go); }
  .chip.stuck { color:var(--stuck); border-color:var(--stuck); }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:8px 16px; cursor:pointer; border-bottom:2px solid transparent; color:var(--dim); background:none; border-top:none; border-left:none; border-right:none; font:inherit; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--rev); }
  .journey { display:flex; align-items:center; gap:0; margin:10px 0 18px; flex-wrap:wrap; }
  .jnode { display:flex; flex-direction:column; align-items:center; width:110px; text-align:center; }
  .jdot { width:14px; height:14px; border-radius:50%; background:var(--line); margin-bottom:4px; }
  .jnode.lit .jdot { background:var(--go); box-shadow:0 0 8px var(--go); }
  .jnode.now .jdot { background:var(--you); box-shadow:0 0 10px var(--you); animation:pulse 1.6s infinite; }
  .jnode span { font-size:11px; color:var(--dim); }
  .jnode.lit span, .jnode.now span { color:var(--ink); }
  .jbar { flex:1 1 30px; height:2px; background:var(--line); margin-bottom:18px; min-width:20px; }
  .jbar.lit { background:var(--go); }
  @keyframes pulse { 50% { box-shadow:0 0 2px var(--you); } }
  .jflag { padding:2px 10px; border-radius:99px; font-size:12px; margin-left:10px; }
  .jflag.you { background:#3d2f10; color:var(--you); border:1px solid var(--you); }
  .jflag.stuck { background:#3a1512; color:var(--stuck); border:1px solid var(--stuck); }
  .doc { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:16px 20px; margin-bottom:16px; }
  .doc h3 { margin:0 0 10px; font-size:14px; color:var(--rev); cursor:pointer; }
  .doc .md { max-height:420px; overflow-y:auto; }
  .doc.open .md { max-height:none; }
  .doc .md table { border-collapse:collapse; margin:10px 0; }
  .doc .md th, .doc .md td { border:1px solid var(--line); padding:5px 10px; font-size:13px; }
  .doc .md th { background:var(--panel); }
  .doc .md code { background:var(--panel); padding:1px 5px; border-radius:5px; font-size:13px; }
  .doc .md pre { background:var(--panel); padding:10px; border-radius:8px; overflow-x:auto; }
  .doc .md blockquote { border-left:3px solid var(--line); margin:8px 0; padding:2px 14px; color:var(--dim); }
  .item { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px 16px; margin-bottom:10px; }
  .item.flash { border-color:var(--you); box-shadow:0 0 10px rgba(245,166,35,.35); }
  .item h4 { margin:0 0 6px; font-size:14px; }
  .item .meta { font-size:12px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
  .idl { color:var(--rev); cursor:pointer; text-decoration:underline dotted; }
  .empty { color:var(--dim); font-style:italic; padding:24px; text-align:center; }
  .qcard textarea { width:100%; min-height:64px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  .btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font:inherit; }
  .btn.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  .btn.warn { color:var(--amber); border-color:var(--amber); }
  .btn.go { color:var(--go); border-color:var(--go); }
  .opts { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .opt { text-align:left; }
  .opt[aria-pressed="true"] { border-color:var(--you); color:var(--you); }
  .err { color:var(--stuck); font-size:13px; margin-top:6px; white-space:pre-wrap; }
  .evi { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); border-left:2px solid var(--line); padding:2px 10px; margin:4px 0; }
  .sev { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); }
  .sev.b { color:var(--stuck); border-color:var(--stuck); }
  .sev.d { color:var(--amber); border-color:var(--amber); }
  .sev.s { color:var(--rev); border-color:var(--rev); }
  footer { color:var(--dim); font-size:12px; padding:16px 20px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>The spec library</h1>
  <input id="search" type="search" placeholder="Search specs…" aria-label="Search specs">
  <span id="counts" style="color:var(--dim);font-size:13px"></span>
</header>
<div id="layout">
  <aside id="pane" aria-label="Specs list"></aside>
  <main id="detail"><div class="empty">Choose a spec on the left.</div></main>
</div>
<footer id="foot"></footer>
<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
