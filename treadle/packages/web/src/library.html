<!doctype html>
<html lang="en">
  <head>
    <script>
      /* pre-render theme resolution (FR-2): the shared key, read before first paint */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The spec library</title>
    <style>
      /* Quiet Workspace: shared semantic roles in both existing surfaces. */
      :root,
      [data-theme='light'] {
        /* Light appearance. */
        --bg: #f5f5f7;
        --surface-1: #ffffff;
        --surface-2: #f5f5f7;
        --surface-3: #e5efff;
        --surface-4: #e5e5ea;
        --ink: #1d1d1f;
        --ink-2: #515158;
        --primary: #0064d9;
        --primary-c: #004fa9;
        --tertiary: #6d5e00;
        --error: #b42318;
        --error-bg: #ffdad6;
        --pass: #187035;
        --warn: #915400;
        --smell: #515158;
        --focus: rgba(9, 76, 178, 0.35);
        --ghost: rgba(195, 198, 213, 0.15);
        --voice-body: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --action: #0064d9;
        --on-action: #ffffff;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius: 10px;
        --voice-mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      [data-theme='dark'] {
        /* Dark appearance. */
        --bg: #1c1c1e;
        --surface-1: #242426;
        --surface-2: #2c2c2e;
        --surface-3: #173656;
        --surface-4: #3a3a3c;
        --ink: #f5f5f7;
        --ink-2: #b4b4bc;
        --primary: #8ec1ff;
        --primary-c: #8ec1ff;
        --tertiary: #f9e37a;
        --error: #ff9b92;
        --error-bg: #3a1a20;
        --pass: #83dba0;
        --warn: #ffd28a;
        --smell: #b4b4bc;
        --focus: rgba(56, 189, 248, 0.4);
        --ghost: rgba(148, 163, 184, 0.15);
        color-scheme: dark;
      }
      /* Existing role aliases preserve the browser components. */
      :root {
        --panel: var(--surface-1);
        --card: var(--surface-2);
        --line: var(--ghost);
        --dim: var(--ink-2);
        --you: var(--primary);
        --go: var(--pass);
        --stuck: var(--error);
        --amber: var(--warn);
        --rev: var(--primary-c);
      }

      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        height: 100svh;
        margin: 0;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
      }
      header h1 {
        font-size: 19px;
        margin: 0;
        font-family: var(--voice-body);
        letter-spacing: 0.01em;
      }
      #search {
        flex: 0 1 340px;
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: var(--surface-2);
        color: var(--ink);
      }
      #layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 240px;
        min-height: 0;
      }
      aside {
        padding: 14px;
        overflow-y: auto;
        min-height: 0;
        background: var(--surface-1);
      }
      main {
        padding: var(--space-5);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
        background: var(--surface-1);
      }
      #tabbody {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-gutter: stable;
      }
      .group h2 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-2);
        margin: 16px 0 8px;
        font-family: var(--voice-body);
      }
      .group h2 .n {
        color: var(--you);
      }
      .card {
        padding: 12px 14px;
        border-radius: 10px;
        background: transparent;
        margin-bottom: var(--space-1);
        cursor: pointer;
        transition: background 0.15s;
      }
      .card:hover,
      .card.sel {
        background: var(--surface-3);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .card .t {
        font-family: var(--voice-body);
        font-size: 15px;
      }
      .card .m {
        font-size: 12px;
        color: var(--dim);
        display: flex;
        gap: 8px;
        margin-top: 2px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-family: var(--voice-body);
        background: var(--surface-3);
        color: var(--ink-2);
      }
      .chip.you {
        color: var(--primary);
        background: color-mix(in srgb, var(--primary) 10%, transparent);
      }
      .chip.go {
        color: var(--pass);
        background: color-mix(in srgb, var(--pass) 10%, transparent);
      }
      .chip.stuck {
        color: var(--error);
        background: color-mix(in srgb, var(--error) 10%, transparent);
      }
      .tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        background: none;
        font: inherit;
        color: var(--ink-2);
        border-radius: 8px 8px 0 0;
      }
      .tab[aria-selected='true'] {
        color: var(--ink);
        font-family: var(--voice-body);
        box-shadow: inset 0 -2px 0 var(--primary);
      }
      .journey {
        display: flex;
        align-items: center;
        gap: 0;
        margin: 10px 0 18px;
        flex-wrap: wrap;
      }
      .jnode {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 110px;
        text-align: center;
      }
      .jdot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--line);
        margin-bottom: 4px;
      }
      .jnode.lit .jdot {
        background: var(--go);
      }
      .jnode.now .jdot {
        background: var(--you);
      }
      .jnode span {
        font-size: 11px;
        color: var(--ink-2);
      }
      .jnode.lit span,
      .jnode.now span {
        color: var(--ink);
      }
      .jbar {
        flex: 1 1 30px;
        height: 2px;
        background: var(--line);
        margin-bottom: 18px;
        min-width: 20px;
      }
      .jbar.lit {
        background: var(--go);
      }
      .jflag {
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        margin-left: 10px;
      }
      .jflag.you {
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--you);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .jflag.stuck {
        background: color-mix(in srgb, var(--error) 12%, transparent);
        color: var(--stuck);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .doc {
        border-radius: var(--radius);
        background: var(--surface-2);
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .doc h3 {
        margin: 0 0 10px;
        font-size: 15px;
        color: var(--primary);
        cursor: pointer;
        font-family: var(--voice-body);
      }
      .doc .md {
        max-height: 420px;
        overflow-y: auto;
      }
      .doc.open .md {
        max-height: none;
      }
      .doc .md table {
        border-collapse: collapse;
        margin: 10px 0;
      }
      .doc .md th,
      .doc .md td {
        padding: 5px 10px;
        font-size: 13px;
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .doc .md th {
        background: var(--panel);
      }
      .doc .md code {
        background: var(--panel);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 13px;
      }
      .doc .md pre {
        background: var(--surface-3);
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .doc .md blockquote {
        border-left: 3px solid var(--line);
        margin: 8px 0;
        padding: 2px 14px;
        color: var(--dim);
      }
      .item {
        border-radius: var(--radius);
        background: var(--surface-2);
        padding: 12px 16px;
        margin-bottom: 10px;
      }
      .item.flash {
        background: var(--surface-3);
      }
      .item h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-family: var(--voice-body);
      }
      .item .meta {
        font-size: 12px;
        color: var(--dim);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .idl {
        color: var(--rev);
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .empty {
        color: var(--dim);
        padding: 24px;
        text-align: center;
      }
      .qcard textarea {
        box-shadow: inset 0 0 0 1px var(--ghost);
        width: 100%;
        min-height: 64px;
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      .btn {
        background: var(--surface-3);
        color: var(--ink);
        border: none;
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font: inherit;
      }
      .btn.primary,
      .btn.go {
        min-height: 44px;
        background: var(--action);
        color: var(--on-action);
        font-weight: 600;
      }
      .btn.warn {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 8px 0;
      }
      .opt {
        text-align: left;
      }
      .opt[aria-pressed='true'] {
        border-color: var(--you);
        color: var(--you);
      }
      .err {
        color: var(--stuck);
        font-size: 13px;
        margin-top: 6px;
        white-space: pre-wrap;
      }
      .evi {
        font-family: var(--voice-body);
        font-size: 12px;
        color: var(--ink-2);
        border-left: 2px solid var(--ghost);
        padding: 2px 10px;
        margin: 4px 0;
      }
      .sev {
        font-size: 11px;
        font-family: var(--voice-body);
        padding: 1px 9px;
        border-radius: 99px;
      }
      .sev.b {
        color: var(--error);
        background: color-mix(in srgb, var(--error) 10%, transparent);
      }
      .sev.d {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }
      .sev.s {
        color: var(--smell);
        background: color-mix(in srgb, var(--smell) 10%, transparent);
      }
      footer {
        color: var(--ink-2);
        font-size: 12px;
        padding: 16px 20px;
        background: var(--surface-1);
      }

      /* the phase inspector (DES-6) */
      .phase-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 9px 10px;
        margin-bottom: 6px;
        border-radius: 10px;
        background: var(--surface-2);
        cursor: pointer;
      }
      .phase-row:hover {
        background: var(--surface-3);
      }
      .phase-n {
        font-family: var(--voice-body);
        font-size: 15px;
        color: var(--primary);
      }
      .phase-body {
        flex: 1;
      }
      .phase-label {
        font-family: var(--voice-body);
        font-size: 13px;
      }
      .phase-state {
        font-family: var(--voice-body);
        font-size: 11px;
        color: var(--ink-2);
      }
      .phase-view {
        font-family: var(--voice-body);
        font-size: 10px;
        color: var(--ink-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* the telemetry panel (DES-7) */
      .sev-filter {
        background: var(--surface-2);
        border: none;
        border-radius: 8px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-family: var(--voice-body);
      }
      .sev-filter[aria-pressed='true'] {
        background: var(--surface-4);
      }
      .sev {
        color: var(--ink);
        background: var(--surface-4);
      }
      .sev.b,
      .sev.d,
      .sev.s {
        color: var(--ink);
        background: var(--surface-4);
      }
      /* Existing owner controls share the Quiet Workspace hierarchy. */
      :root {
        --owner-gap: 12px;
        --owner-target: 36px;
      }
      #layout {
        grid-template-columns: 240px minmax(0, 1fr) 240px;
      }
      #detail,
      #pane,
      #inspector {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .owner-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--owner-gap);
        margin-top: var(--owner-gap);
      }
      .owner-panel h3 {
        margin-top: 0;
      }
      .owner-panel p {
        line-height: 1.6;
      }
      label {
        display: block;
        margin: var(--owner-gap) 0 6px;
      }
      textarea {
        max-width: 100%;
        box-sizing: border-box;
      }
      button,
      summary,
      .phase-row,
      .card {
        min-height: var(--owner-target);
      }
      button,
      summary {
        min-width: var(--owner-target);
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      .owner-feedback {
        padding: 0 18px;
        background: var(--surface-1);
      }
      #owner-status:empty {
        display: none;
      }
      #owner-error {
        color: var(--error);
        padding: 12px 0;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        body {
          display: block;
          height: auto;
        }
        #tabbody {
          overflow: visible;
        }
        aside {
          position: static;
          max-height: none;
        }
        #layout {
          grid-template-columns: 210px minmax(0, 1fr);
        }
        #inspector {
          grid-column: 1 / -1;
          position: static;
          max-height: none;
        }
        main {
          padding: 18px;
        }
      }
      @media (max-width: 600px) {
        header {
          flex-wrap: wrap;
          height: auto;
        }
        #layout {
          display: block;
        }
        aside {
          position: static;
          max-height: none;
        }
        #pane {
          max-height: 240px;
        }
        .tabs {
          flex-wrap: wrap;
        }
        .journey {
          overflow-x: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
      :root {
        --feedback-gap: var(--space-4);
        --feedback-target: 36px;
        --feedback-radius: 8px;
        --feedback-pad: 8px;
        --feedback-preview-height: 320px;
      }
      .feedback-active header {
        position: static;
      }
      .feedback-content {
        overflow-wrap: anywhere;
      }
      .feedback-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--feedback-gap);
        align-items: end;
        margin-block: var(--feedback-gap);
      }
      .feedback-controls label {
        flex: 1 1 12rem;
        min-width: 0;
      }
      .feedback-controls select,
      .feedback-controls input {
        width: 100%;
        min-height: var(--feedback-target);
        background: var(--surface-1);
        color: var(--ink);
      }
      .feedback-sources {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
        gap: var(--feedback-gap);
      }
      .feedback-source {
        min-width: 0;
      }
      .feedback-line {
        display: flex;
        gap: var(--feedback-gap);
        min-height: var(--feedback-target);
        width: 100%;
        text-align: left;
        padding: var(--feedback-pad);
        background: var(--surface-1);
        color: var(--ink);
        border: 0;
        border-radius: var(--feedback-radius);
        margin-block: 2px;
      }
      .feedback-line:disabled {
        opacity: 1;
        cursor: default;
      }
      .feedback-line code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-width: 0;
        font-family: var(--voice-body);
      }
      .feedback-number {
        color: var(--ink-2);
        flex: 0 0 3ch;
      }
      .feedback-content textarea {
        width: 100%;
        background: var(--surface-1);
        color: var(--ink);
      }
      .feedback-preview {
        width: 100%;
        height: var(--feedback-preview-height);
        border: 0;
        background: var(--surface-1);
      }
      .feedback-thread {
        padding: var(--feedback-gap);
        border-radius: var(--feedback-radius);
        background: var(--surface-2);
        margin-block: var(--feedback-gap);
      }
      .feedback-thread .btn {
        margin: var(--feedback-pad);
      }
      #feedback-error {
        color: var(--error);
      }
      .feedback-content button,
      .feedback-content summary {
        min-height: var(--feedback-target);
      }
      @media (max-width: 900px) {
        .feedback-sources {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      input,
      textarea,
      select {
        font: inherit;
      }
      summary {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The spec library</h1>
      <input id="search" type="search" placeholder="Search specs…" aria-label="Search specs" />
      <button
        type="button"
        class="btn theme-toggle"
        id="themeToggle"
        title="light / dark"
        aria-label="Toggle light or dark theme"
      >
        ◐
      </button>
      <span id="counts" style="color: var(--dim); font-size: 13px"></span>
    </header>
    <div class="owner-feedback">
      <p id="owner-status" role="status" aria-live="polite"></p>
      <div id="owner-error" role="alert" tabindex="-1" hidden></div>
      <button type="button" class="btn" id="owner-refresh" hidden>Refresh spec</button>
    </div>
    <div id="layout">
      <aside id="pane" aria-label="Specs list"></aside>
      <main id="detail"><div class="empty">Choose a spec on the left.</div></main>
      <aside id="inspector" aria-label="Phase inspector">
        <div class="empty" style="padding: 18px 8px; font-size: 13px">
          The phase inspector lands next.
        </div>
      </aside>
    </div>
    <footer id="foot"></footer>
    <script src="/marked.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
