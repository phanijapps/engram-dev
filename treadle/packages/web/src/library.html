<!doctype html>
<html lang="en">
  <head>
    <script>
      /* pre-render theme resolution (FR-2): the shared key, read before first paint */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The spec library</title>
    <style>
      /* ── The token layer (FR-1, pinned): Alexandria light + dark variant ── */
      :root,
      [data-theme='light'] {
        /* canonical light (decision-studio) + declared derived shades (FR-1) */
        --bg: #faf9fa;
        --surface-1: #f5f3f4;
        --surface-2: #efedee;
        --surface-3: #e9e8e9;
        --surface-4: #e3e2e3;
        --ink: #1b1c1d;
        --ink-2: #434653;
        --primary: #094cb2;
        --primary-c: #3366cc;
        --tertiary: #6d5e00;
        --error: #ba1a1a;
        --error-bg: #ffdad6;
        --pass: #15803d;
        --warn: #b45309;
        --smell: #6d28d9;
        --focus: rgba(9, 76, 178, 0.35);
        --ghost: rgba(195, 198, 213, 0.15);
        --voice-serif: Georgia, 'Iowan Old Style', serif;
        --voice-body: system-ui, sans-serif;
        --voice-mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      [data-theme='dark'] {
        /* canonical dark (library-review) + declared derived shades (FR-1) */
        --bg: #0b0f14;
        --surface-1: #11161f;
        --surface-2: #161d27;
        --surface-3: #1e2836;
        --surface-4: #232d3d;
        --ink: #e2e8f0;
        --ink-2: #94a3b8;
        --primary: #38bdf8;
        --primary-c: #0284c7;
        --tertiary: #f9e37a;
        --error: #f87171;
        --error-bg: #3a1a20;
        --pass: #10b981;
        --warn: #f59e0b;
        --smell: #a855f7;
        --focus: rgba(56, 189, 248, 0.4);
        --ghost: rgba(148, 163, 184, 0.15);
        color-scheme: dark;
      }
      /* legacy aliases: the current CSS consumes these until T-2's reskin */
      :root {
        --panel: var(--surface-1);
        --card: var(--surface-2);
        --line: var(--ghost);
        --dim: var(--ink-2);
        --you: var(--primary);
        --go: var(--pass);
        --stuck: var(--error);
        --amber: var(--warn);
        --rev: var(--primary-c);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      header h1 {
        font-size: 19px;
        margin: 0;
        font-family: var(--voice-serif);
        letter-spacing: 0.01em;
      }
      #search {
        flex: 0 1 340px;
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: var(--surface-2);
        color: var(--ink);
      }
      #layout {
        display: grid;
        grid-template-columns: 300px 1fr 300px;
        min-height: calc(100vh - 57px);
      }
      aside {
        padding: 14px;
        overflow-y: auto;
        max-height: calc(100vh - 57px);
        position: sticky;
        top: 57px;
        background: var(--surface-1);
      }
      main {
        padding: 18px 26px;
        overflow-y: auto;
        background: var(--bg);
      }
      .group h2 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-2);
        margin: 16px 0 8px;
        font-family: var(--voice-mono);
      }
      .group h2 .n {
        color: var(--you);
      }
      .card {
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--surface-2);
        margin-bottom: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .card:hover,
      .card.sel {
        background: var(--surface-3);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .card .t {
        font-family: var(--voice-serif);
        font-size: 15px;
      }
      .card .m {
        font-size: 12px;
        color: var(--dim);
        display: flex;
        gap: 8px;
        margin-top: 2px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-family: var(--voice-mono);
        background: var(--surface-3);
        color: var(--ink-2);
      }
      .chip.you {
        color: var(--primary);
        background: color-mix(in srgb, var(--primary) 10%, transparent);
      }
      .chip.go {
        color: var(--pass);
        background: color-mix(in srgb, var(--pass) 10%, transparent);
      }
      .chip.stuck {
        color: var(--error);
        background: color-mix(in srgb, var(--error) 10%, transparent);
      }
      .tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        background: none;
        font: inherit;
        color: var(--ink-2);
        border-radius: 8px 8px 0 0;
      }
      .tab[aria-selected='true'] {
        color: var(--ink);
        font-family: var(--voice-serif);
        box-shadow: inset 0 -2px 0 var(--primary);
      }
      .journey {
        display: flex;
        align-items: center;
        gap: 0;
        margin: 10px 0 18px;
        flex-wrap: wrap;
      }
      .jnode {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 110px;
        text-align: center;
      }
      .jdot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--line);
        margin-bottom: 4px;
      }
      .jnode.lit .jdot {
        background: var(--go);
        box-shadow: 0 0 8px var(--go);
      }
      .jnode.now .jdot {
        background: var(--you);
        box-shadow: 0 0 10px var(--you);
        animation: pulse 1.6s infinite;
      }
      .jnode span {
        font-size: 11px;
        color: var(--ink-2);
      }
      .jnode.lit span,
      .jnode.now span {
        color: var(--ink);
      }
      .jbar {
        flex: 1 1 30px;
        height: 2px;
        background: var(--line);
        margin-bottom: 18px;
        min-width: 20px;
      }
      .jbar.lit {
        background: var(--go);
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 2px var(--you);
        }
      }
      .jflag {
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        margin-left: 10px;
      }
      .jflag.you {
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--you);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .jflag.stuck {
        background: color-mix(in srgb, var(--error) 12%, transparent);
        color: var(--stuck);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .doc {
        border-radius: 12px;
        background: var(--surface-2);
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .doc h3 {
        margin: 0 0 10px;
        font-size: 15px;
        color: var(--primary);
        cursor: pointer;
        font-family: var(--voice-serif);
      }
      .doc .md {
        max-height: 420px;
        overflow-y: auto;
      }
      .doc.open .md {
        max-height: none;
      }
      .doc .md table {
        border-collapse: collapse;
        margin: 10px 0;
      }
      .doc .md th,
      .doc .md td {
        padding: 5px 10px;
        font-size: 13px;
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .doc .md th {
        background: var(--panel);
      }
      .doc .md code {
        background: var(--panel);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 13px;
      }
      .doc .md pre {
        background: var(--surface-3);
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .doc .md blockquote {
        border-left: 3px solid var(--line);
        margin: 8px 0;
        padding: 2px 14px;
        color: var(--dim);
      }
      .item {
        border-radius: 12px;
        background: var(--surface-2);
        padding: 12px 16px;
        margin-bottom: 10px;
      }
      .item.flash {
        border-color: var(--you);
        box-shadow: 0 0 10px rgba(245, 166, 35, 0.35);
      }
      .item h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-family: var(--voice-serif);
      }
      .item .meta {
        font-size: 12px;
        color: var(--dim);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .idl {
        color: var(--rev);
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .empty {
        color: var(--dim);
        font-style: italic;
        padding: 24px;
        text-align: center;
      }
      .qcard textarea {
        box-shadow: inset 0 0 0 1px var(--ghost);
        width: 100%;
        min-height: 64px;
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      .btn {
        background: var(--surface-3);
        color: var(--ink);
        border: none;
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font: inherit;
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-c));
        color: var(--bg);
      }
      .btn.warn {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
      }
      .btn.go {
        color: var(--pass);
        background: color-mix(in srgb, var(--pass) 12%, transparent);
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 8px 0;
      }
      .opt {
        text-align: left;
      }
      .opt[aria-pressed='true'] {
        border-color: var(--you);
        color: var(--you);
      }
      .err {
        color: var(--stuck);
        font-size: 13px;
        margin-top: 6px;
        white-space: pre-wrap;
      }
      .evi {
        font-family: var(--voice-mono);
        font-size: 12px;
        color: var(--ink-2);
        border-left: 2px solid var(--ghost);
        padding: 2px 10px;
        margin: 4px 0;
      }
      .sev {
        font-size: 11px;
        font-family: var(--voice-mono);
        padding: 1px 9px;
        border-radius: 99px;
      }
      .sev.b {
        color: var(--error);
        background: color-mix(in srgb, var(--error) 10%, transparent);
      }
      .sev.d {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }
      .sev.s {
        color: var(--smell);
        background: color-mix(in srgb, var(--smell) 10%, transparent);
      }
      footer {
        color: var(--ink-2);
        font-size: 12px;
        padding: 16px 20px;
        background: var(--surface-1);
      }

      /* the phase inspector (DES-6) */
      .phase-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 9px 10px;
        margin-bottom: 6px;
        border-radius: 10px;
        background: var(--surface-2);
        cursor: pointer;
      }
      .phase-row:hover {
        background: var(--surface-3);
      }
      .phase-n {
        font-family: var(--voice-serif);
        font-size: 15px;
        color: var(--primary);
      }
      .phase-body {
        flex: 1;
      }
      .phase-label {
        font-family: var(--voice-serif);
        font-size: 13px;
      }
      .phase-state {
        font-family: var(--voice-mono);
        font-size: 11px;
        color: var(--ink-2);
      }
      .phase-view {
        font-family: var(--voice-mono);
        font-size: 10px;
        color: var(--ink-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* the telemetry panel (DES-7) */
      .sev-filter {
        background: var(--surface-2);
        border: none;
        border-radius: 8px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-family: var(--voice-mono);
      }
      .sev-filter[aria-pressed='true'] {
        background: var(--surface-4);
      }
      .sev {
        color: var(--ink);
        background: var(--surface-4);
      }
      .sev.b,
      .sev.d,
      .sev.s {
        color: var(--ink);
        background: var(--surface-4);
      }
      /* Owner controls reuse the Alexandria palette. */
      :root {
        --owner-gap: 12px;
        --owner-target: 32px;
      }
      #layout {
        grid-template-columns: 260px minmax(0, 1fr) 280px;
      }
      #detail,
      #pane,
      #inspector {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .owner-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--owner-gap);
        margin-top: var(--owner-gap);
      }
      .owner-panel h3 {
        margin-top: 0;
      }
      .owner-panel p {
        line-height: 1.6;
      }
      label {
        display: block;
        margin: var(--owner-gap) 0 6px;
      }
      textarea {
        max-width: 100%;
        box-sizing: border-box;
      }
      button,
      summary,
      .phase-row,
      .card {
        min-height: var(--owner-target);
      }
      button,
      summary {
        min-width: var(--owner-target);
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      .owner-feedback {
        padding: 0 18px;
        background: var(--surface-1);
      }
      #owner-status:empty {
        display: none;
      }
      #owner-error {
        color: var(--error);
        padding: 12px 0;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        aside {
          position: static;
          max-height: none;
        }
        #layout {
          grid-template-columns: 210px minmax(0, 1fr);
        }
        #inspector {
          grid-column: 1 / -1;
          position: static;
          max-height: none;
        }
        main {
          padding: 18px;
        }
      }
      @media (max-width: 600px) {
        header {
          flex-wrap: wrap;
          height: auto;
        }
        #layout {
          display: block;
        }
        aside {
          position: static;
          max-height: none;
        }
        #pane {
          max-height: 240px;
        }
        .tabs {
          flex-wrap: wrap;
        }
        .journey {
          overflow-x: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The spec library</h1>
      <input id="search" type="search" placeholder="Search specs…" aria-label="Search specs" />
      <button
        type="button"
        class="btn theme-toggle"
        id="themeToggle"
        title="light / dark"
        aria-label="Toggle light or dark theme"
      >
        ◐
      </button>
      <span id="counts" style="color: var(--dim); font-size: 13px"></span>
    </header>
    <div class="owner-feedback">
      <p id="owner-status" role="status" aria-live="polite"></p>
      <div id="owner-error" role="alert" tabindex="-1" hidden></div>
      <button type="button" class="btn" id="owner-refresh" hidden>Refresh spec</button>
    </div>
    <div id="layout">
      <aside id="pane" aria-label="Specs list"></aside>
      <main id="detail"><div class="empty">Choose a spec on the left.</div></main>
      <aside id="inspector" aria-label="Phase inspector">
        <div class="empty" style="padding: 18px 8px; font-size: 13px">
          The phase inspector lands next.
        </div>
      </aside>
    </div>
    <footer id="foot"></footer>
    <script src="/marked.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
