<!doctype html>
<html lang="en">
  <head>
    <script>
      /* pre-render theme resolution (FR-2): the shared key, read before first paint */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>the interview</title>
    <style>
      /* ── The token layer (FR-1, pinned): Alexandria light + dark variant ── */
      :root,
      [data-theme='light'] {
        /* canonical light (decision-studio) + declared derived shades (FR-1) */
        --bg: #faf9fa;
        --surface-1: #f5f3f4;
        --surface-2: #efedee;
        --surface-3: #e9e8e9;
        --surface-4: #e3e2e3;
        --ink: #1b1c1d;
        --ink-2: #434653;
        --primary: #094cb2;
        --primary-c: #3366cc;
        --tertiary: #6d5e00;
        --error: #ba1a1a;
        --error-bg: #ffdad6;
        --pass: #15803d;
        --warn: #b45309;
        --smell: #6d28d9;
        --focus: rgba(9, 76, 178, 0.35);
        --ghost: rgba(195, 198, 213, 0.15);
        --voice-serif: Georgia, 'Iowan Old Style', serif;
        --voice-body: system-ui, sans-serif;
        --voice-mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      [data-theme='dark'] {
        /* canonical dark (library-review) + declared derived shades (FR-1) */
        --bg: #0b0f14;
        --surface-1: #11161f;
        --surface-2: #161d27;
        --surface-3: #1e2836;
        --surface-4: #232d3d;
        --ink: #e2e8f0;
        --ink-2: #94a3b8;
        --primary: #38bdf8;
        --primary-c: #0284c7;
        --tertiary: #f9e37a;
        --error: #f87171;
        --error-bg: #3a1a20;
        --pass: #10b981;
        --warn: #f59e0b;
        --smell: #a855f7;
        --focus: rgba(56, 189, 248, 0.4);
        --ghost: rgba(148, 163, 184, 0.15);
        color-scheme: dark;
      }
      /* legacy aliases: the current CSS consumes these until T-2's reskin */
      :root {
        --panel: var(--surface-1);
        --card: var(--surface-2);
        --line: var(--ghost);
        --dim: var(--ink-2);
        --you: var(--primary);
        --go: var(--pass);
        --stuck: var(--error);
        --amber: var(--warn);
        --rev: var(--primary-c);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.5 var(--voice-body);
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 22px;
        position: sticky;
        top: 0;
        z-index: 5;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      header h1 {
        font-size: 19px;
        margin: 0;
        font-family: var(--voice-serif);
      }
      header .sub {
        color: #b9c2c9;
        font-size: 12.5px;
      }
      .chip {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-family: var(--voice-mono);
        background: var(--surface-3);
        color: var(--ink-2);
      }
      .chip.on {
        background: #1d3a34;
        color: #9fe0d0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(280px, 5fr) minmax(360px, 7fr);
        gap: 16px;
        padding: 16px 20px 60px;
        max-width: 1240px;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        .pane {
          position: static;
        }
      }
      h2 {
        font-size: 11.5px;
        margin: 16px 0 7px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .card {
        background: var(--surface-2);
        border-radius: 10px;
        padding: 11px 13px;
        box-shadow: inset 0 0 0 1px var(--ghost);
        margin-bottom: 9px;
      }
      .card h3 {
        margin: 0 0 3px;
        font-size: 13.5px;
      }
      .idchip {
        font:
          700 10.5px/1 ui-monospace,
          monospace;
        background: var(--soft);
        color: var(--accent);
        padding: 3px 7px;
        border-radius: 4px;
        margin-right: 6px;
      }
      .st {
        font:
          700 10px/1 ui-monospace,
          monospace;
        padding: 3px 7px;
        border-radius: 4px;
      }
      .st-open {
        background: #fde2e2;
        color: var(--bad);
      }
      .st-res {
        background: #d8efdf;
        color: var(--good);
      }
      .st-unk {
        background: #fdeecd;
        color: var(--warn);
      }
      .st-acc {
        background: #d8efdf;
        color: var(--good);
      }
      .st-rej {
        background: #fde2e2;
        color: var(--bad);
      }
      .st-prop {
        background: #e8eaee;
        color: #525f6f;
      }
      .st-todo {
        background: #e8eaee;
        color: #525f6f;
      }
      .st-doing {
        background: #fdeecd;
        color: var(--warn);
      }
      .st-done {
        background: #d8efdf;
        color: var(--good);
      }
      .st-blocked {
        background: #fde2e2;
        color: var(--bad);
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        margin: 3px 0 0;
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px dotted var(--accent);
        font-size: 12px;
        margin-right: 9px;
      }
      .ring {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 2px 0 8px;
      }
      .ring .stage {
        font:
          700 12px/1.3 ui-monospace,
          monospace;
      }
      .ring .stage small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 10px;
      }
      .rounds {
        font:
          600 11.5px/1.5 ui-monospace,
          monospace;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 9px;
        margin-top: 12px;
      }
      .rounds b {
        color: var(--ink);
      }
      .pane {
        position: sticky;
        top: 12px;
        align-self: start;
      }
      .qhead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .count {
        font:
          700 11px/1 ui-monospace,
          monospace;
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .qcard {
        border-radius: 12px;
        background: var(--surface-2);
        padding: 18px 20px;
        margin-bottom: 14px;
      }
      .qcard.done {
        border-left-color: #b7c4bd;
      }
      .qtext {
        font-size: 17px;
        line-height: 1.45;
        margin: 6px 0 4px;
        font-weight: 560;
      }
      .blocks {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 7px 0;
        cursor: pointer;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .opt:hover,
      .opt:focus-visible {
        box-shadow: inset 0 0 0 2px var(--focus);
      }
      .opt.sel {
        background: var(--surface-3);
        box-shadow: inset 0 0 0 2px var(--primary);
      }
      .opt .dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid var(--line);
        margin-top: 2px;
        flex: none;
      }
      .opt.sel .dot {
        border-color: var(--accent);
        background: var(--accent);
      }
      .opt .lbl {
        font-size: 14px;
      }
      .opt .key {
        font:
          700 10px/1 ui-monospace,
          monospace;
        color: var(--muted);
        margin-left: auto;
        flex: none;
      }
      textarea {
        box-shadow: inset 0 0 0 1px var(--ghost);
        border-radius: 8px;
        background: var(--surface-1);
        color: var(--ink);
        padding: 8px;
        font: inherit;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .qnav {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button.act {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 8px 16px;
        font: 650 13px/1 inherit;
        cursor: pointer;
      }
      .b-next {
        background: var(--ink);
        color: #fff;
      }
      .b-back {
        background: var(--surface-3);
        color: var(--ink);
      }
      .b-idk {
        background: color-mix(in srgb, var(--warn) 10%, transparent);
        border: 1.5px dashed var(--warn);
        color: var(--warn);
      }
      .b-approve {
        background: linear-gradient(135deg, var(--primary), var(--primary-c));
        color: #fff;
        font-size: 14.5px;
        padding: 11px 24px;
        margin-left: auto;
      }
      .kbd {
        font:
          600 10.5px/1 ui-monospace,
          monospace;
        color: var(--ink-2);
        background: var(--surface-3);
        border-radius: 5px;
        padding: 3px 6px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 10px;
      }
      .ansline {
        font-size: 13px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px dashed var(--line);
      }
      .approve-card {
        text-align: center;
        padding: 26px 20px;
      }
      .summary {
        text-align: left;
        margin: 12px auto;
        max-width: 420px;
      }
      .summary .row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 5px 2px;
        border-bottom: 1px solid #eef0ec;
        font-size: 12.5px;
      }
      .err {
        color: var(--error);
        font-family: var(--voice-mono);
        font-size: 12px;
      }
      ul.tight {
        margin: 4px 0 0;
        padding-left: 16px;
      }
      ul.tight li {
        margin: 2px 0;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="h-name">…</h1>
      <span class="sub" id="h-desc"></span>
      <span style="flex: 1"></span>
      <span class="chip" id="h-life">…</span>
      <span class="chip" id="h-rev">…</span>
      <button
        class="btn theme-toggle"
        id="themeToggle"
        title="light / dark"
        aria-label="Toggle light or dark theme"
      >
        ◐
      </button>
    </header>
    <main>
      <section id="dossier"></section>
      <section class="pane">
        <div class="qhead">
          <span class="count" id="qcount"></span><span style="flex: 1"></span
          ><span class="chip on">the interview</span>
        </div>
        <div id="qhost">
          <div class="qcard"><p class="note">loading the spec…</p></div>
        </div>
        <p class="hint" id="hints">
          <span class="kbd">j</span>/<span class="kbd">k</span> move ·
          <span class="kbd">Enter</span> submit · <span class="kbd">1</span>-<span class="kbd"
            >9</span
          >
          pick · or click anything
        </p>
      </section>
    </main>
    <script src="/page.js"></script>
  </body>
</html>
