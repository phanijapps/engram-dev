<!doctype html>
<html lang="en">
  <head>
    <script>
      /* pre-render theme resolution (FR-2): the shared key, read before first paint */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>the interview</title>
    <style>
      /* Quiet Workspace: shared semantic roles in both existing surfaces. */
      :root,
      [data-theme='light'] {
        /* Light appearance. */
        --bg: #f5f5f7;
        --surface-1: #ffffff;
        --surface-2: #f5f5f7;
        --surface-3: #e5efff;
        --surface-4: #e5e5ea;
        --ink: #1d1d1f;
        --ink-2: #515158;
        --primary: #0064d9;
        --primary-c: #004fa9;
        --tertiary: #6d5e00;
        --error: #b42318;
        --error-bg: #ffdad6;
        --pass: #187035;
        --warn: #915400;
        --smell: #515158;
        --focus: rgba(9, 76, 178, 0.35);
        --ghost: rgba(195, 198, 213, 0.15);
        --voice-body: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --action: #0064d9;
        --on-action: #ffffff;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius: 10px;
        --voice-mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      [data-theme='dark'] {
        /* Dark appearance. */
        --bg: #1c1c1e;
        --surface-1: #242426;
        --surface-2: #2c2c2e;
        --surface-3: #173656;
        --surface-4: #3a3a3c;
        --ink: #f5f5f7;
        --ink-2: #b4b4bc;
        --primary: #8ec1ff;
        --primary-c: #8ec1ff;
        --tertiary: #f9e37a;
        --error: #ff9b92;
        --error-bg: #3a1a20;
        --pass: #83dba0;
        --warn: #ffd28a;
        --smell: #b4b4bc;
        --focus: rgba(56, 189, 248, 0.4);
        --ghost: rgba(148, 163, 184, 0.15);
        color-scheme: dark;
      }
      /* Existing role aliases preserve the browser components. */
      :root {
        --panel: var(--surface-1);
        --card: var(--surface-2);
        --line: var(--ghost);
        --dim: var(--ink-2);
        --you: var(--primary);
        --go: var(--pass);
        --stuck: var(--error);
        --amber: var(--warn);
        --rev: var(--primary-c);
        --muted: var(--ink-2);
        --accent: var(--primary);
        --soft: var(--surface-3);
        --good: var(--pass);
        --bad: var(--error);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.5 var(--voice-body);
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 22px;
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
      }
      header h1 {
        font-size: 19px;
        margin: 0;
        font-family: var(--voice-body);
      }
      header .sub {
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .chip {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-family: var(--voice-body);
        background: var(--surface-3);
        color: var(--ink-2);
      }
      .chip.on {
        background: color-mix(in srgb, var(--pass) 14%, transparent);
        color: var(--pass);
      }
      main {
        display: grid;
        grid-template-columns: minmax(280px, 5fr) minmax(360px, 7fr);
        gap: 16px;
        padding: 16px 20px 60px;
        max-width: 1240px;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        .pane {
          position: static;
        }
      }
      h2 {
        font-size: 11.5px;
        margin: 16px 0 7px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .card {
        background: var(--surface-2);
        border-radius: 10px;
        padding: 11px 13px;
        box-shadow: inset 0 0 0 1px var(--ghost);
        margin-bottom: 9px;
      }
      .card h3 {
        margin: 0 0 3px;
        font-size: 13.5px;
      }
      .idchip {
        font:
          700 10.5px/1 ui-monospace,
          monospace;
        background: var(--soft);
        color: var(--accent);
        padding: 3px 7px;
        border-radius: 4px;
        margin-right: 6px;
      }
      .st {
        font:
          700 10px/1 ui-monospace,
          monospace;
        padding: 3px 7px;
        border-radius: 4px;
      }
      .st-open {
        background: color-mix(in srgb, var(--error) 12%, transparent);
        color: var(--bad);
      }
      .st-res {
        background: color-mix(in srgb, var(--pass) 12%, transparent);
        color: var(--good);
      }
      .st-unk {
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        color: var(--warn);
      }
      .st-acc {
        background: color-mix(in srgb, var(--pass) 12%, transparent);
        color: var(--good);
      }
      .st-rej {
        background: color-mix(in srgb, var(--error) 12%, transparent);
        color: var(--bad);
      }
      .st-prop {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .st-todo {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .st-doing {
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        color: var(--warn);
      }
      .st-done {
        background: color-mix(in srgb, var(--pass) 12%, transparent);
        color: var(--good);
      }
      .st-blocked {
        background: color-mix(in srgb, var(--error) 12%, transparent);
        color: var(--bad);
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        margin: 3px 0 0;
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        box-shadow: inset 0 -1px 0 var(--ghost);
        font-size: 12px;
        margin-right: 9px;
      }
      .ring {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 2px 0 8px;
      }
      .ring .stage {
        font:
          700 12px/1.3 ui-monospace,
          monospace;
      }
      .ring .stage small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 10px;
      }
      .rounds {
        font:
          600 11.5px/1.5 ui-monospace,
          monospace;
        color: var(--muted);
        box-shadow: inset 0 1px 0 var(--ghost);
        padding-top: 9px;
        margin-top: 12px;
      }
      .rounds b {
        color: var(--ink);
      }
      .pane {
        position: sticky;
        top: 80px;
        align-self: start;
      }
      .qhead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .count {
        font:
          700 11px/1 ui-monospace,
          monospace;
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .qcard {
        border-radius: var(--radius);
        background: var(--surface-1);
        padding: var(--space-5);
        margin-bottom: 14px;
      }
      .qtext {
        font-size: 24px;
        line-height: 1.45;
        margin: 6px 0 4px;
        font-weight: 560;
      }
      .blocks {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 7px 0;
        cursor: pointer;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--ghost);
      }
      .opt:hover,
      .opt:focus-visible {
        box-shadow: inset 0 0 0 2px var(--focus);
      }
      .opt.sel {
        background: var(--surface-3);
        box-shadow: inset 0 0 0 2px var(--primary);
      }
      .opt .dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 2px var(--ghost);
        margin-top: 2px;
        flex: none;
      }
      .opt.sel .dot {
        box-shadow: inset 0 0 0 2px var(--focus);
        background: var(--accent);
      }
      .opt .lbl {
        font-size: 14px;
      }
      .opt .key {
        font:
          700 10px/1 ui-monospace,
          monospace;
        color: var(--muted);
        margin-left: auto;
        flex: none;
      }
      textarea {
        box-shadow: inset 0 0 0 1px var(--ghost);
        border-radius: 8px;
        background: var(--surface-1);
        color: var(--ink);
        padding: 8px;
        font: inherit;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .qnav .b-next {
        margin-left: auto;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 120px;
      }
      .pane,
      #dossier {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .qnav {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button.act {
        appearance: none;
        border: 0;
        border-radius: var(--radius);
        padding: 8px 16px;
        min-height: 36px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.act.b-next {
        min-height: 44px;
        background: var(--action);
        color: var(--on-action);
      }
      .b-back {
        background: var(--surface-3);
        color: var(--ink);
      }
      .b-idk {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      button.act.b-approve {
        min-height: 44px;
        background: var(--action);
        color: var(--on-action);
        font-size: 14.5px;
        padding: 11px 24px;
        margin-left: auto;
      }
      .kbd {
        font:
          600 10.5px/1 ui-monospace,
          monospace;
        color: var(--ink-2);
        background: var(--surface-3);
        border-radius: 5px;
        padding: 3px 6px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 10px;
      }
      .ansline {
        font-size: 13px;
        margin-top: 9px;
        padding-top: 9px;
        box-shadow: inset 0 1px 0 var(--ghost);
      }
      .approve-card {
        text-align: center;
        padding: 26px 20px;
      }
      .summary {
        text-align: left;
        margin: 12px auto;
        max-width: 420px;
      }
      .summary .row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 5px 2px;
        box-shadow: inset 0 -1px 0 var(--ghost);
        font-size: 12.5px;
      }
      .err {
        color: var(--error);
        font-family: var(--voice-body);
        font-size: 12px;
      }
      ul.tight {
        margin: 4px 0 0;
        padding-left: 16px;
      }
      ul.tight li {
        margin: 2px 0;
        font-size: 12.5px;
      }
      .btn {
        min-height: 36px;
        border: 0;
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-4);
        font: inherit;
        background: var(--surface-2);
        color: var(--ink);
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      @media (max-width: 900px) {
        header {
          flex-wrap: wrap;
        }
        main {
          padding: var(--space-4);
          min-width: 0;
        }
        .pane {
          position: static;
          min-width: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      input,
      textarea,
      select {
        font: inherit;
      }
      summary {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="h-name">…</h1>
      <span class="sub" id="h-desc"></span>
      <span style="flex: 1"></span>
      <span class="chip" id="h-life">…</span>
      <span class="chip" id="h-rev">…</span>
      <button
        type="button"
        class="btn theme-toggle"
        id="themeToggle"
        title="light / dark"
        aria-label="Toggle light or dark theme"
      >
        ◐
      </button>
    </header>
    <main>
      <section id="dossier"></section>
      <section class="pane">
        <div class="qhead">
          <span class="count" id="qcount"></span><span style="flex: 1"></span
          ><span class="chip on">the interview</span>
        </div>
        <p id="room-status" role="status" aria-live="polite"></p>
        <div id="qhost">
          <div class="qcard"><p class="note">loading the spec…</p></div>
        </div>
        <p class="hint" id="hints">
          <span class="kbd">j</span>/<span class="kbd">k</span> move ·
          <span class="kbd">Enter</span> submit · <span class="kbd">1</span>-<span class="kbd"
            >9</span
          >
          pick · or click anything
        </p>
      </section>
    </main>
    <script src="/page.js"></script>
  </body>
</html>
